name: Update Fourth Street Scene Click Total

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-fourth-street-scene-clicks.yml"

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Update only Fourth Street click fields
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_TABLE_NAME: ${{ secrets.AIRTABLE_TABLE_NAME }}
        run: |
          python - <<'PY'
          import airtable

          record_id = "rec6ghgPUPIufBXfA"
          records = airtable.get_all_records()
          record = next((r for r in records if r.get("id") == record_id), None)
          if not record:
              raise RuntimeError("Fourth Street record ID was not found")

          fields = record.get("fields", {})
          advertiser = str(fields.get("Advertiser") or "").strip()
          newsletter = str(fields.get("Newsletter") or "").strip()
          site = fields.get("Site") or []
          if isinstance(site, str):
              site = [site]

          if advertiser != "Fourth Street" or newsletter != "The Scene" or "The Scene" not in site:
              raise RuntimeError("Record identity check failed; no Airtable update performed")

          result = airtable.update_record(
              record_id,
              {
                  "Total Clicks": 36,
                  "Click Sync Date": "2026-11-16",
              },
          )
          print("Updated Fourth Street / The Scene:")
          print("Total Clicks = 36")
          print("Click Sync Date = 2026-11-16")
          print("Only those two Airtable fields were changed.")
          PY
