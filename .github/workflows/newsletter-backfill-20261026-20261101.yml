name: One-time Newsletter Metrics Backfill (Oct 26-Nov 1, 2026)

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/newsletter-backfill-20261026-20261101.yml"

permissions:
  contents: read

jobs:
  backfill:
    # Run only for the specific commit that creates this one-time workflow.
    if: github.event.head_commit.message == 'Backfill newsletter metrics for 2026-10-26 through 2026-11-01'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write October 26-November 1 newsletter metrics to Airtable
        env:
          ACTIVECAMPAIGN_API_URL: ${{ secrets.ACTIVECAMPAIGN_API_URL }}
          ACTIVECAMPAIGN_API_KEY: ${{ secrets.ACTIVECAMPAIGN_API_KEY }}
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_TABLE_NAME: ${{ secrets.AIRTABLE_TABLE_NAME }}
        run: |
          python newsletter_reporting/aggregate_dry_run.py --write --yes --start-date 2026-10-26 --end-date 2026-11-01

      - name: Save backfill CSV report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newsletter-backfill-2026-10-26-through-2026-11-01
          path: newsletter_reporting/newsletter_aggregation_dry_run.csv
          if-no-files-found: warn
          retention-days: 30
