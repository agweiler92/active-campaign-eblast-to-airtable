name: Manual ActiveCampaign Eblast Catch-up (Nov 17, 2026)

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/manual-eblast-catchup-20261117.yml"

permissions:
  contents: read

jobs:
  sync:
    if: github.event.head_commit.message == 'Run ActiveCampaign Eblast sync catch-up on 2026-11-17'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run existing ActiveCampaign to Airtable Eblast sync
        env:
          ACTIVECAMPAIGN_API_URL: ${{ secrets.ACTIVECAMPAIGN_API_URL }}
          ACTIVECAMPAIGN_API_KEY: ${{ secrets.ACTIVECAMPAIGN_API_KEY }}
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_TABLE_NAME: ${{ secrets.AIRTABLE_TABLE_NAME }}
        run: |
          python sync_campaigns.py
