name: Diagnose Saturday Unique Opens (Nov 7)

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/diagnose-saturday-uniqueopens-20261107.yml"

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.head_commit.message == 'Diagnose Saturday unique opens for November 7 2026'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compare Saturday campaign unique opens
        env:
          ACTIVECAMPAIGN_API_URL: ${{ secrets.ACTIVECAMPAIGN_API_URL }}
          ACTIVECAMPAIGN_API_KEY: ${{ secrets.ACTIVECAMPAIGN_API_KEY }}
        run: |
          python - <<'PY'
          import activecampaign
          from datetime import datetime

          campaigns = activecampaign.get_all_campaigns()
          selected = []
          for c in campaigns:
              sdate = c.get("sdate") or ""
              if sdate[:10] != "2026-11-07" or str(c.get("status")) != "5":
                  continue
              selected.append(c)

          keys=("name","id","sdate","send_amt","opens","uniqueopens","verified_opens","verified_unique_opens")
          print(f"Saturday sent campaigns found: {len(selected)}")
          totals={k:0 for k in ("send_amt","opens","uniqueopens","verified_opens","verified_unique_opens")}
          for c in sorted(selected,key=lambda x:x.get("name","")):
              print(" | ".join(f"{k}={c.get(k)}" for k in keys))
              for k in totals:
                  try: totals[k]+=int(float(c.get(k) or 0))
                  except (ValueError,TypeError): pass
          print("SATURDAY TOTALS: "+" | ".join(f"{k}={v}" for k,v in totals.items()))
          PY
