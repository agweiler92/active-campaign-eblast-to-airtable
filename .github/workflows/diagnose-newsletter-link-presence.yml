name: Diagnose Newsletter Link Presence

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/diagnose-newsletter-link-presence.yml"

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.head_commit.message == 'Diagnose advertiser link presence in historical newsletter messages'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Inspect message content without printing message bodies
        env:
          ACTIVECAMPAIGN_API_URL: ${{ secrets.ACTIVECAMPAIGN_API_URL }}
          ACTIVECAMPAIGN_API_KEY: ${{ secrets.ACTIVECAMPAIGN_API_KEY }}
        run: |
          python - <<'PY'
          import html
          from urllib.parse import unquote
          import activecampaign

          target = "moniforberkeley.com"
          campaign_ids = ["1503", "1519", "1527", "1540", "1557"]

          def scan(value, path="$"):
              found = []
              if isinstance(value, dict):
                  for key, item in value.items():
                      found.extend(scan(item, f"{path}.{key}"))
              elif isinstance(value, list):
                  for i, item in enumerate(value):
                      found.extend(scan(item, f"{path}[{i}]"))
              elif isinstance(value, str):
                  candidate = value
                  for _ in range(5):
                      if target in candidate.lower():
                          found.append((path, len(value)))
                          break
                      decoded = unquote(html.unescape(candidate))
                      if decoded == candidate:
                          break
                      candidate = decoded
              return found

          for campaign_id in campaign_ids:
              try:
                  message = activecampaign.get_campaign_message(campaign_id)
                  print(f"Campaign {campaign_id}: response_type={type(message).__name__}")
                  if isinstance(message, dict):
                      print("  top_level_keys=" + ",".join(sorted(message.keys())))
                  matches = scan(message)
                  print(f"  target_domain_present={bool(matches)}")
                  for field_path, length in matches[:5]:
                      print(f"  matched_field={field_path}; original_string_length={length}")
              except Exception as exc:
                  print(f"Campaign {campaign_id}: ERROR {type(exc).__name__}")
          PY
