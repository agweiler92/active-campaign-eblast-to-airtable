name: Diagnose Newsletter Message Body

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/diagnose-newsletter-message-body.yml"

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.head_commit.message == 'Inspect historical ActiveCampaign message body fields'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Inspect message body metadata and target URL presence
        env:
          ACTIVECAMPAIGN_API_URL: ${{ secrets.ACTIVECAMPAIGN_API_URL }}
          ACTIVECAMPAIGN_API_KEY: ${{ secrets.ACTIVECAMPAIGN_API_KEY }}
        run: |
          python - <<'PY'
          import html
          import requests
          from urllib.parse import unquote
          import activecampaign

          target = "moniforberkeley.com"
          campaign_ids = ["1503", "1519", "1527", "1540", "1557"]

          def scan(value, path="$"):
              found = []
              if isinstance(value, dict):
                  for key, item in value.items():
                      found.extend(scan(item, f"{path}.{key}"))
              elif isinstance(value, list):
                  for i, item in enumerate(value):
                      found.extend(scan(item, f"{path}[{i}]"))
              elif isinstance(value, str):
                  candidate = value
                  for _ in range(6):
                      if target in candidate.lower():
                          found.append((path, len(value)))
                          break
                      decoded = unquote(html.unescape(candidate))
                      if decoded == candidate:
                          break
                      candidate = decoded
              return found

          for campaign_id in campaign_ids:
              try:
                  campaign_message = activecampaign.get_campaign_message(campaign_id)
                  message_id = campaign_message.get("messageid") or campaign_message.get("message")
                  print(f"Campaign {campaign_id}: message_id_type={type(message_id).__name__}")
                  print(f"  message_id={message_id}")
                  if not message_id:
                      continue
                  url = f"{activecampaign.API_URL.rstrip('/')}/api/3/messages/{message_id}"
                  response = requests.get(url, headers=activecampaign.HEADERS, timeout=30)
                  print(f"  message_endpoint_status={response.status_code}")
                  response.raise_for_status()
                  payload = response.json()
                  if isinstance(payload, dict):
                      print("  response_keys=" + ",".join(sorted(payload.keys())))
                  matches = scan(payload)
                  print(f"  target_domain_present={bool(matches)}")
                  for field_path, length in matches[:10]:
                      print(f"  matched_field={field_path}; original_string_length={length}")
                  def shapes(obj, path="$"):
                      if isinstance(obj, dict):
                          for key, value in obj.items():
                              if isinstance(value, (str, int, float, bool)) or value is None:
                                  print(f"  field_shape={path}.{key}:{type(value).__name__}" + (f":len={len(value)}" if isinstance(value,str) else ""))
                              else:
                                  shapes(value, f"{path}.{key}")
                      elif isinstance(obj, list) and obj:
                          shapes(obj[0], f"{path}[0]")
                  shapes(payload)
              except Exception as exc:
                  print(f"Campaign {campaign_id}: ERROR {type(exc).__name__}")
          PY
