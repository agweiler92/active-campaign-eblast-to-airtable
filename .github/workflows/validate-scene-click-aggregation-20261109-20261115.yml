name: Validate Scene Multi-link Click Aggregation (Nov 9-15)

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/validate-scene-click-aggregation-20261109-20261115.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run read-only validation for November 9-15
        env:
          ACTIVECAMPAIGN_API_URL: ${{ secrets.ACTIVECAMPAIGN_API_URL }}
          ACTIVECAMPAIGN_API_KEY: ${{ secrets.ACTIVECAMPAIGN_API_KEY }}
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_TABLE_NAME: ${{ secrets.AIRTABLE_TABLE_NAME }}
        run: |
          python newsletter_reporting/aggregate_dry_run.py --start-date 2026-11-09 --end-date 2026-11-15
      - name: Save validation CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newsletter-scene-click-validation-2026-11-09-through-2026-11-15
          path: newsletter_reporting/newsletter_aggregation_dry_run.csv
          if-no-files-found: warn
          retention-days: 30
