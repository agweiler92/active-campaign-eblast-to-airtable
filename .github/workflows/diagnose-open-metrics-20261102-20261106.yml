name: Diagnose ActiveCampaign Opens (Nov 2-6)

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/diagnose-open-metrics-20261102-20261106.yml"

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.head_commit.message == 'Diagnose ActiveCampaign total and unique opens for Nov 2-6'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compare campaign-level open metrics
        env:
          ACTIVECAMPAIGN_API_URL: ${{ secrets.ACTIVECAMPAIGN_API_URL }}
          ACTIVECAMPAIGN_API_KEY: ${{ secrets.ACTIVECAMPAIGN_API_KEY }}
        run: |
          python - <<'PY'
          import activecampaign

          ids = {
              "Oaklandside": ["1574", "1586", "1610", "1621", "1641"],
              "Berkeleyside": ["1575", "1585", "1607", "1619", "1642"],
          }
          wanted = {cid for group in ids.values() for cid in group}
          campaigns = activecampaign.get_all_campaigns()
          by_id = {str(c.get("id") or c.get("campaignid")): c for c in campaigns}

          keys = (
              "send_amt", "opens", "uniqueopens", "verified_opens",
              "verified_unique_opens", "linkclicks", "uniquelinkclicks",
              "total_amt", "sdate", "name", "status"
          )

          for site, site_ids in ids.items():
              totals = {k: 0 for k in keys if k not in ("sdate", "name", "status")}
              print(f"\n{site}")
              for cid in site_ids:
                  campaign = by_id.get(cid)
                  if not campaign:
                      print(f"  ID {cid}: NOT FOUND")
                      continue
                  print(f"  ID {cid}: " + " | ".join(f"{k}={campaign.get(k)}" for k in keys))
                  for k in totals:
                      try:
                          totals[k] += int(float(campaign.get(k) or 0))
                      except (TypeError, ValueError):
                          pass
              print("  SUMS: " + " | ".join(f"{k}={v}" for k,v in totals.items()))
          PY
